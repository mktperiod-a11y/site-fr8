name: 검사

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 전체 커밋 기록까지 검사
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 규칙 테스트
        run: node --test tests/*.test.mjs
      - name: 화면 검사
        run: node tests/view.mjs --shots .out/shots
      - name: 스크린샷 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .out/shots
          retention-days: 7
      - name: 검사 범위 정하기
        id: range
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && ! echo "$before" | grep -q '^0*$'; then
            echo "range=$before..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch -q origin main || true
            echo "range=origin/main..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: 공개 정보 검사
        env:
          DENY_LIST: ${{ secrets.EMBER_RB8 }}
          LEAK_LIST: ${{ secrets.ANCHOR_J40 }}
        run: |
          if [ "${{ inputs.full_history }}" = "true" ]; then
            node scripts/birch-ledger.mjs --out .out/test/real --all-history
          else
            node scripts/birch-ledger.mjs --out .out/test/real --range "${{ steps.range.outputs.range }}"
          fi
